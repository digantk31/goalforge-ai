steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/goalforge-backend', './backend']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/goalforge-backend']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'goalforge-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/goalforge-backend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'PROJECT_NAME=GoalForge API,GEMINI_API_KEY=${_GEMINI_API_KEY},MONGODB_URI=${_MONGODB_URI}'

substitutions:
  _GEMINI_API_KEY: ''
  _MONGODB_URI: ''

images:
  - 'gcr.io/$PROJECT_ID/goalforge-backend'
